name: Validate Repository Structure

# Runs on every push and pull request so the /docs folder is
# checked continuously as the POE evolves.
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  validate-docs-folder:
    name: Check /docs folder contents
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "::error::The /docs folder is missing from the repository root."
            exit 1
          fi
          echo "docs folder found."

      - name: Confirm ERD image is present (PNG or PDF)
        run: |
          if ! ls docs/*.png docs/*.pdf 1> /dev/null 2>&1; then
            echo "::error::No ERD image (PNG or PDF) found in /docs."
            exit 1
          fi
          echo "ERD image found."

      - name: Confirm API endpoint plan is present (PDF or Markdown)
        run: |
          if ! ls docs/*Endpoint*.md docs/*Endpoint*.pdf 1> /dev/null 2>&1; then
            echo "::error::No API endpoint plan (PDF or Markdown) found in /docs."
            exit 1
          fi
          echo "API endpoint plan found."

      - name: Confirm SQL script is present
        run: |
          if ! ls docs/*.sql 1> /dev/null 2>&1; then
            echo "::error::No .sql script found in /docs."
            exit 1
          fi
          echo "SQL script found."

      - name: Confirm README exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "::error::README.md is missing from the repository root."
            exit 1
          fi
          echo "README.md found."

      - name: Summary
        run: echo "All required planning documents are present. Repository structure is valid."
